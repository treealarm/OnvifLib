# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore -p:ContinuousIntegrationBuild=true
    - name: Test
      run: dotnet test --no-build --verbosity normal
    - name: Pack
      run: dotnet pack --configuration Release --no-build

    # A push to main is a build; a tag is a release. The tag has to name the version in
    # OnvifLib.csproj, so a release cannot go out under the wrong number, and a version already on
    # nuget.org fails the push instead of being skipped: --skip-duplicate once let a fix sit
    # unpublished on main because nobody had bumped <Version>.
    - name: Check the tag names the package version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        version=$(dotnet msbuild OnvifLib.csproj -getProperty:Version)
        if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
          echo "::error::tag $GITHUB_REF_NAME does not match <Version>$version</Version> in OnvifLib.csproj"
          exit 1
        fi

    - name: Push to NuGet
      if: startsWith(github.ref, 'refs/tags/v')
      run: dotnet nuget push "**/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}
