name: Release GUI

on:
  push:
    tags:
      - "gui-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. gui-1.0.0). Leave empty to use the pushed tag only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runs_on: ubuntu-latest
            ffmpeg_url: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-12-13-12/ffmpeg-n8.1.3-18-g46d899d7a0-linux64-lgpl-8.1.tar.xz
            ffmpeg_sha: 0734ef5b56a90adaa6b4999b02c4df603e1fd29a73067839620efc7706117517
            ffmpeg_archive: ffmpeg-linux64-lgpl.tar.xz
            ffmpeg_bin: ffmpeg
          - rid: win-x64
            runs_on: ubuntu-latest
            ffmpeg_url: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-12-13-12/ffmpeg-n8.1.3-18-g46d899d7a0-win64-lgpl-8.1.zip
            ffmpeg_sha: fa6c5563a794a4dc98cb521e7aad1526004149d308f99ff0ca30159b1451c522
            ffmpeg_archive: ffmpeg-win64-lgpl.zip
            ffmpeg_bin: ffmpeg.exe

    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish OnvifLib.Gui (${{ matrix.rid }})
        run: |
          set -euo pipefail
          OUT="artifacts/OnvifLib.Gui-${{ matrix.rid }}"
          mkdir -p artifacts
          dotnet publish samples/OnvifLib.Gui/OnvifLib.Gui.csproj \
            -c Release -r "${{ matrix.rid }}" --self-contained true \
            -o "$OUT" \
            -p:PublishSingleFile=false \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            --nologo

      - name: Bundle LGPL ffmpeg
        run: |
          set -euo pipefail
          OUT="artifacts/OnvifLib.Gui-${{ matrix.rid }}"
          ARCHIVE="artifacts/${{ matrix.ffmpeg_archive }}"
          STAGE=artifacts/ffmpeg-stage-${{ matrix.rid }}
          curl -fsSL -o "$ARCHIVE" "${{ matrix.ffmpeg_url }}"
          echo "${{ matrix.ffmpeg_sha }}  $ARCHIVE" | sha256sum -c -
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          case "$ARCHIVE" in
            *.zip) unzip -q "$ARCHIVE" -d "$STAGE" ;;
            *) tar -xJf "$ARCHIVE" -C "$STAGE" ;;
          esac
          BIN=$(find "$STAGE" -type f -name '${{ matrix.ffmpeg_bin }}' | head -n1)
          test -n "$BIN"
          mkdir -p "$OUT/ffmpeg"
          cp "$BIN" "$OUT/ffmpeg/${{ matrix.ffmpeg_bin }}"
          chmod +x "$OUT/ffmpeg/${{ matrix.ffmpeg_bin }}" || true
          cat > "$OUT/ffmpeg/README.txt" <<'EOF'
          Bundled ffmpeg is an LGPL build from BtbN/FFmpeg-Builds (n8.1.x).
          Source and licenses: https://github.com/BtbN/FFmpeg-Builds
          The OnvifLib.Gui app itself is MIT; this binary is LGPL.
          EOF

      - name: Zip
        run: |
          set -euo pipefail
          cd artifacts
          zip -qr "OnvifLib.Gui-${{ matrix.rid }}.zip" "OnvifLib.Gui-${{ matrix.rid }}"
          ls -lh "OnvifLib.Gui-${{ matrix.rid }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: OnvifLib.Gui-${{ matrix.rid }}
          path: artifacts/OnvifLib.Gui-${{ matrix.rid }}.zip
          if-no-files-found: error

  msi:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download win-x64 zip
        uses: actions/download-artifact@v7
        with:
          name: OnvifLib.Gui-win-x64
          path: dist

      - name: Unpack payload
        shell: pwsh
        run: |
          Get-ChildItem -Recurse dist | Select-Object FullName, Length | Format-Table -AutoSize
          $zip = Get-ChildItem -Recurse dist -Filter 'OnvifLib.Gui-win-x64.zip' |
            Select-Object -First 1
          if (-not $zip) { throw "OnvifLib.Gui-win-x64.zip not found under dist/" }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath artifacts -Force
          if (-not (Test-Path artifacts/OnvifLib.Gui-win-x64/OnvifLib.Gui.exe)) {
            Get-ChildItem -Recurse artifacts | Select-Object FullName | Format-Table -AutoSize
            throw "expected artifacts/OnvifLib.Gui-win-x64/OnvifLib.Gui.exe after unzip"
          }
          Test-Path artifacts/OnvifLib.Gui-win-x64/ffmpeg/ffmpeg.exe

      - name: MSI version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          VER="${TAG#gui-}"
          if ! echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "tag '$TAG' is not gui-major.minor[.build]; using 0.0.0 for a non-tag build"
            VER="0.0.0"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build MSI
        shell: pwsh
        run: |
          # Forward slashes: MSBuild -p: with Windows backslashes mangles the path.
          $publish = ((Resolve-Path artifacts/OnvifLib.Gui-win-x64).Path -replace '\\','/') + '/'
          Write-Host "GuiPublishDir=$publish"
          Write-Host "exe=$(Test-Path (Join-Path $publish 'OnvifLib.Gui.exe')) ffmpeg=$(Test-Path (Join-Path $publish 'ffmpeg/ffmpeg.exe'))"
          dotnet build samples/OnvifLib.Gui.Setup/OnvifLib.Gui.Setup.wixproj `
            -c Release `
            -p:Platform=x64 `
            "-p:GuiPublishDir=$publish" `
            "-p:Version=${{ steps.ver.outputs.version }}" `
            --nologo
          $msi = Get-ChildItem -Recurse samples/OnvifLib.Gui.Setup/bin -Filter OnvifLib.Gui.msi |
            Select-Object -First 1
          if (-not $msi) { throw "WiX build produced no OnvifLib.Gui.msi" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item $msi.FullName artifacts/OnvifLib.Gui-win-x64.msi
          Get-Item artifacts/OnvifLib.Gui-win-x64.msi | Format-List Name, Length, FullName

      - name: Upload MSI
        uses: actions/upload-artifact@v6
        with:
          name: OnvifLib.Gui-win-x64-msi
          path: artifacts/OnvifLib.Gui-win-x64.msi
          if-no-files-found: error

  snap:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download linux-x64 zip
        uses: actions/download-artifact@v7
        with:
          name: OnvifLib.Gui-linux-x64
          path: dist

      - name: Snap version
        id: ver
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          VER="${TAG#gui-}"
          if echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag '$TAG' is not gui-major.minor[.build]; building a test snap that is not published"
            VER="0.0.0+git${GITHUB_SHA::7}"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      # Same payload as the zip: the snap is a repackaging, not a second build.
      - name: Stage publish output
        run: packaging/snap/stage.sh dist/OnvifLib.Gui-linux-x64.zip "${{ steps.ver.outputs.version }}"

      - name: Build snap
        id: snap
        uses: snapcore/action-build@v1
        with:
          path: packaging/snap

      - name: Upload snap
        uses: actions/upload-artifact@v6
        with:
          name: OnvifLib.Gui-linux-x64-snap
          path: ${{ steps.snap.outputs.snap }}
          if-no-files-found: error

      # Needs the SNAPCRAFT_STORE_CREDENTIALS secret (packaging/snap/README.md, "Store setup").
      - name: Publish to the Snap Store (stable)
        if: steps.ver.outputs.publish == 'true'
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.snap }}
          release: stable

  release:
    needs: [build, msi]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Locate packages
        id: zips
        run: |
          set -euo pipefail
          find dist -type f \( -name 'OnvifLib.Gui-*.zip' -o -name 'OnvifLib.Gui-*.msi' \) -print
          test -f dist/OnvifLib.Gui-linux-x64.zip
          test -f dist/OnvifLib.Gui-win-x64.zip
          test -f dist/OnvifLib.Gui-win-x64.msi
          ls -lh dist/OnvifLib.Gui-*

      - name: Release meta
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=OnvifLib.Gui ${TAG#gui-}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          files: |
            dist/OnvifLib.Gui-linux-x64.zip
            dist/OnvifLib.Gui-win-x64.zip
            dist/OnvifLib.Gui-win-x64.msi
          fail_on_unmatched_files: true
          body: |
            ## OnvifLib.Gui

            Cross-platform **ONVIF Device Manager alternative** (Avalonia): discover/add cameras, live **H.264 / HEVC** via bundled ffmpeg, PTZ, imaging, events, analytics, Profile G archive replay, Device I/O.

            ### Downloads
            - **OnvifLib.Gui-win-x64.msi** — Windows x64 (**WiX** installer → Program Files, Start Menu). Prefer this over the zip so Windows does not mark binaries as downloaded from the Internet.
            - **OnvifLib.Gui-win-x64.zip** — Windows x64 portable (same payload; no separate installer)
            - **OnvifLib.Gui-linux-x64.zip** — Linux x64 portable, self-contained .NET 10 + LGPL `ffmpeg`. Preferred on Linux: `sudo snap install onviflib-gui` (same payload, from the Snap Store)

            Bundled ffmpeg (BtbN n8.1.x) lives under `ffmpeg/` next to the app.

            ### Run (Windows)
            Install `OnvifLib.Gui-win-x64.msi`, or unzip the portable zip and run `OnvifLib.Gui.exe`.

            ### Run (Linux)
            ```bash
            sudo snap install onviflib-gui
            sudo snap connect onviflib-gui:password-manager-service   # only for "Remember password"
            ```
            or the portable zip:
            ```bash
            unzip OnvifLib.Gui-linux-x64.zip
            cd OnvifLib.Gui-linux-x64
            ./OnvifLib.Gui
            ```

            Library NuGet (separate): `dotnet add package OnvifLib`.

            ### Notes
            - Linux needs a desktop session (X11/Wayland).
            - App is MIT; bundled `ffmpeg` is LGPL — see `ffmpeg/README.txt`.
            - winget manifests: `packaging/winget`; snap recipe: `packaging/snap` in the repo.
