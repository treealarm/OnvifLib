name: Release GUI

on:
  push:
    tags:
      - "gui-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. gui-1.0.0). Leave empty to use the pushed tag only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runs_on: ubuntu-latest
            ffmpeg_url: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-12-13-15/ffmpeg-n7.1.5-12-g1fdbca85aa-linux64-lgpl-7.1.tar.xz
            ffmpeg_sha: 2fc7aa2eb6e75807170a34fec11af8eea3bc39875cf001d26eabc1605de99a87
            ffmpeg_archive: ffmpeg-linux64-lgpl.tar.xz
            ffmpeg_bin: ffmpeg
          - rid: win-x64
            runs_on: ubuntu-latest
            ffmpeg_url: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-12-13-15/ffmpeg-n7.1.5-12-g1fdbca85aa-win64-lgpl-7.1.zip
            ffmpeg_sha: 8fdbe7f03b64134fecf26166a22d4b4f5be0756901461d01fe5ad7dbc03b5ce7
            ffmpeg_archive: ffmpeg-win64-lgpl.zip
            ffmpeg_bin: ffmpeg.exe

    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish OnvifLib.Gui (${{ matrix.rid }})
        run: |
          set -euo pipefail
          OUT="artifacts/OnvifLib.Gui-${{ matrix.rid }}"
          mkdir -p artifacts
          dotnet publish samples/OnvifLib.Gui/OnvifLib.Gui.csproj \
            -c Release -r "${{ matrix.rid }}" --self-contained true \
            -o "$OUT" \
            -p:PublishSingleFile=false \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            --nologo

      - name: Bundle LGPL ffmpeg
        run: |
          set -euo pipefail
          OUT="artifacts/OnvifLib.Gui-${{ matrix.rid }}"
          ARCHIVE="artifacts/${{ matrix.ffmpeg_archive }}"
          STAGE=artifacts/ffmpeg-stage-${{ matrix.rid }}
          curl -fsSL -o "$ARCHIVE" "${{ matrix.ffmpeg_url }}"
          echo "${{ matrix.ffmpeg_sha }}  $ARCHIVE" | sha256sum -c -
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          case "$ARCHIVE" in
            *.zip) unzip -q "$ARCHIVE" -d "$STAGE" ;;
            *) tar -xJf "$ARCHIVE" -C "$STAGE" ;;
          esac
          BIN=$(find "$STAGE" -type f -name '${{ matrix.ffmpeg_bin }}' | head -n1)
          test -n "$BIN"
          mkdir -p "$OUT/ffmpeg"
          cp "$BIN" "$OUT/ffmpeg/${{ matrix.ffmpeg_bin }}"
          chmod +x "$OUT/ffmpeg/${{ matrix.ffmpeg_bin }}" || true
          cat > "$OUT/ffmpeg/README.txt" <<'EOF'
          Bundled ffmpeg is an LGPL build from BtbN/FFmpeg-Builds (n7.1.x).
          Source and licenses: https://github.com/BtbN/FFmpeg-Builds
          The OnvifLib.Gui app itself is MIT; this binary is LGPL.
          EOF

      - name: Zip
        run: |
          set -euo pipefail
          cd artifacts
          zip -qr "OnvifLib.Gui-${{ matrix.rid }}.zip" "OnvifLib.Gui-${{ matrix.rid }}"
          ls -lh "OnvifLib.Gui-${{ matrix.rid }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnvifLib.Gui-${{ matrix.rid }}
          path: artifacts/OnvifLib.Gui-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Locate zips
        id: zips
        run: |
          set -euo pipefail
          find dist -type f -name 'OnvifLib.Gui-*.zip' -print
          test -f dist/OnvifLib.Gui-linux-x64.zip
          test -f dist/OnvifLib.Gui-win-x64.zip
          ls -lh dist/*.zip

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
          name: OnvifLib.Gui ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
          files: |
            dist/OnvifLib.Gui-linux-x64.zip
            dist/OnvifLib.Gui-win-x64.zip
          fail_on_unmatched_files: true
          body: |
            ## OnvifLib.Gui

            Desktop ONVIF device manager (Avalonia): discover/add cameras, live video, PTZ, imaging, events, analytics, Profile G archive replay, Device I/O.

            ### Downloads
            - **OnvifLib.Gui-linux-x64.zip** — Ubuntu / Linux x64, self-contained .NET 10 + LGPL `ffmpeg`
            - **OnvifLib.Gui-win-x64.zip** — Windows x64, self-contained .NET 10 + LGPL `ffmpeg.exe`

            Bundled ffmpeg (BtbN n7.1.x) lives under `ffmpeg/` next to the app — no separate install for in-window playback.

            ### Run (Linux)
            ```bash
            unzip OnvifLib.Gui-linux-x64.zip
            cd OnvifLib.Gui-linux-x64
            ./OnvifLib.Gui
            ```

            ### Run (Windows)
            Unzip `OnvifLib.Gui-win-x64.zip` and run `OnvifLib.Gui.exe`.

            The library NuGet remains separate: `dotnet add package OnvifLib`.

            ### Notes
            - Linux needs a desktop session (X11/Wayland).
            - App is MIT; bundled `ffmpeg` is LGPL — see `ffmpeg/README.txt`.
