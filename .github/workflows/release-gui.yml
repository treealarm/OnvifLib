name: Release GUI

on:
  push:
    tags:
      - "gui-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. gui-1.0.0). Leave empty to use the pushed tag only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runs_on: ubuntu-latest
            ffmpeg_url: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-12-13-15/ffmpeg-n7.1.5-12-g1fdbca85aa-linux64-lgpl-7.1.tar.xz
            ffmpeg_sha: 2fc7aa2eb6e75807170a34fec11af8eea3bc39875cf001d26eabc1605de99a87
            ffmpeg_archive: ffmpeg-linux64-lgpl.tar.xz
            ffmpeg_bin: ffmpeg
          - rid: win-x64
            runs_on: ubuntu-latest
            ffmpeg_url: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-12-13-15/ffmpeg-n7.1.5-12-g1fdbca85aa-win64-lgpl-7.1.zip
            ffmpeg_sha: 8fdbe7f03b64134fecf26166a22d4b4f5be0756901461d01fe5ad7dbc03b5ce7
            ffmpeg_archive: ffmpeg-win64-lgpl.zip
            ffmpeg_bin: ffmpeg.exe

    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish OnvifLib.Gui (${{ matrix.rid }})
        run: |
          set -euo pipefail
          OUT="artifacts/OnvifLib.Gui-${{ matrix.rid }}"
          mkdir -p artifacts
          dotnet publish samples/OnvifLib.Gui/OnvifLib.Gui.csproj \
            -c Release -r "${{ matrix.rid }}" --self-contained true \
            -o "$OUT" \
            -p:PublishSingleFile=false \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            --nologo

      - name: Bundle LGPL ffmpeg
        run: |
          set -euo pipefail
          OUT="artifacts/OnvifLib.Gui-${{ matrix.rid }}"
          ARCHIVE="artifacts/${{ matrix.ffmpeg_archive }}"
          STAGE=artifacts/ffmpeg-stage-${{ matrix.rid }}
          curl -fsSL -o "$ARCHIVE" "${{ matrix.ffmpeg_url }}"
          echo "${{ matrix.ffmpeg_sha }}  $ARCHIVE" | sha256sum -c -
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          case "$ARCHIVE" in
            *.zip) unzip -q "$ARCHIVE" -d "$STAGE" ;;
            *) tar -xJf "$ARCHIVE" -C "$STAGE" ;;
          esac
          BIN=$(find "$STAGE" -type f -name '${{ matrix.ffmpeg_bin }}' | head -n1)
          test -n "$BIN"
          mkdir -p "$OUT/ffmpeg"
          cp "$BIN" "$OUT/ffmpeg/${{ matrix.ffmpeg_bin }}"
          chmod +x "$OUT/ffmpeg/${{ matrix.ffmpeg_bin }}" || true
          cat > "$OUT/ffmpeg/README.txt" <<'EOF'
          Bundled ffmpeg is an LGPL build from BtbN/FFmpeg-Builds (n7.1.x).
          Source and licenses: https://github.com/BtbN/FFmpeg-Builds
          The OnvifLib.Gui app itself is MIT; this binary is LGPL.
          EOF

      - name: Zip
        run: |
          set -euo pipefail
          cd artifacts
          zip -qr "OnvifLib.Gui-${{ matrix.rid }}.zip" "OnvifLib.Gui-${{ matrix.rid }}"
          ls -lh "OnvifLib.Gui-${{ matrix.rid }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnvifLib.Gui-${{ matrix.rid }}
          path: artifacts/OnvifLib.Gui-${{ matrix.rid }}.zip
          if-no-files-found: error

  msi:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download win-x64 zip
        uses: actions/download-artifact@v4
        with:
          name: OnvifLib.Gui-win-x64
          path: dist

      - name: Unpack payload
        shell: pwsh
        run: |
          Expand-Archive -Path dist/OnvifLib.Gui-win-x64.zip -DestinationPath artifacts -Force
          if (-not (Test-Path artifacts/OnvifLib.Gui-win-x64/OnvifLib.Gui.exe)) {
            throw "expected artifacts/OnvifLib.Gui-win-x64/OnvifLib.Gui.exe after unzip"
          }

      - name: MSI version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          VER="${TAG#gui-}"
          if ! echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "tag '$TAG' is not gui-major.minor[.build]; using 0.0.0 for a non-tag build"
            VER="0.0.0"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build MSI
        shell: pwsh
        run: |
          $publish = (Resolve-Path artifacts/OnvifLib.Gui-win-x64).Path
          dotnet build samples/OnvifLib.Gui.Setup/OnvifLib.Gui.Setup.wixproj `
            -c Release `
            -p:GuiPublishDir=$publish `
            -p:Version=${{ steps.ver.outputs.version }} `
            --nologo
          $msi = Get-ChildItem -Recurse samples/OnvifLib.Gui.Setup/bin -Filter OnvifLib.Gui.msi |
            Select-Object -First 1
          if (-not $msi) { throw "WiX build produced no OnvifLib.Gui.msi" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item $msi.FullName artifacts/OnvifLib.Gui-win-x64.msi
          Get-Item artifacts/OnvifLib.Gui-win-x64.msi | Format-List Name, Length, FullName

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: OnvifLib.Gui-win-x64-msi
          path: artifacts/OnvifLib.Gui-win-x64.msi
          if-no-files-found: error

  release:
    needs: [build, msi]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Locate packages
        id: zips
        run: |
          set -euo pipefail
          find dist -type f \( -name 'OnvifLib.Gui-*.zip' -o -name 'OnvifLib.Gui-*.msi' \) -print
          test -f dist/OnvifLib.Gui-linux-x64.zip
          test -f dist/OnvifLib.Gui-win-x64.zip
          test -f dist/OnvifLib.Gui-win-x64.msi
          ls -lh dist/OnvifLib.Gui-*

      - name: Release meta
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=OnvifLib.Gui ${TAG#gui-}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          files: |
            dist/OnvifLib.Gui-linux-x64.zip
            dist/OnvifLib.Gui-win-x64.zip
            dist/OnvifLib.Gui-win-x64.msi
          fail_on_unmatched_files: true
          body: |
            ## OnvifLib.Gui

            Desktop ONVIF device manager (Avalonia): discover/add cameras, live video, PTZ, imaging, events, analytics, Profile G archive replay, Device I/O.

            ### Downloads
            - **OnvifLib.Gui-win-x64.msi** — Windows x64 installer (Program Files, Start Menu). Prefer this over the zip so Windows does not mark the binaries as downloaded from the Internet.
            - **OnvifLib.Gui-win-x64.zip** — Windows x64 portable, self-contained .NET 10 + LGPL `ffmpeg.exe`
            - **OnvifLib.Gui-linux-x64.zip** — Ubuntu / Linux x64, self-contained .NET 10 + LGPL `ffmpeg`

            Bundled ffmpeg (BtbN n7.1.x) lives under `ffmpeg/` next to the app — no separate install for in-window playback.

            ### Run (Windows)
            Install `OnvifLib.Gui-win-x64.msi`, or unzip the portable zip and run `OnvifLib.Gui.exe`.

            ### Run (Linux)
            ```bash
            unzip OnvifLib.Gui-linux-x64.zip
            cd OnvifLib.Gui-linux-x64
            ./OnvifLib.Gui
            ```

            The library NuGet remains separate: `dotnet add package OnvifLib`.

            ### Notes
            - Linux needs a desktop session (X11/Wayland).
            - App is MIT; bundled `ffmpeg` is LGPL — see `ffmpeg/README.txt`.
